[interne]
; Appel vers un compte. Si personne ne décroche, si le call manager refuse
; (486 occupé, 480 ne pas déranger) ou si le compte est injoignable, l'appelant
; tombe sur la messagerie vocale. Seul un refus 603 (liste noire) raccroche.
exten => _1XXX,1,NoOp(Appel de ${CALLERID(num)} vers ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},25)
 same => n,Set(SIPCAUSE=${HANGUPCAUSE(${HANGUPCAUSE_KEYS()},tech)})
 same => n,NoOp(Fin : DIALSTATUS=${DIALSTATUS} cause SIP=${SIPCAUSE})
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?fin)
 same => n,GotoIf($["${SIPCAUSE}" : ".*603"]?fin)
 same => n,GotoIf($["${DIALSTATUS}" = "BUSY"]?occupe)
 same => n,VoiceMail(${EXTEN}@default,u)
 same => n(fin),Hangup()
 same => n(occupe),VoiceMail(${EXTEN}@default,b)
 same => n,Hangup()

; Consultation de sa propre messagerie (sans code PIN).
exten => 8000,1,Answer()
 same => n,VoiceMailMain(${CALLERID(num)}@default,s)
 same => n,Hangup()

exten => 600,1,Answer()
 same => n,Echo()
 same => n,Hangup()

[messages]
; Un SIP MESSAGE ("SMS") arrive pour le numéro EXTEN -> on le transmet à ce compte.
exten => _X.,1,NoOp(SMS de ${MESSAGE(from)} vers ${EXTEN} : ${MESSAGE(body)})
 same => n,MessageSend(pjsip:${EXTEN},${MESSAGE(from)})
 same => n,NoOp(Statut d'envoi : ${MESSAGE_SEND_STATUS})
 same => n,Hangup()
