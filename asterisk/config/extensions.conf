[interne]
exten => _1XXX,1,NoOp(Appel de ${CALLERID(num)} vers ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()

exten => 600,1,Answer()
 same => n,Echo()
 same => n,Hangup()

[messages]
; Un SIP MESSAGE ("SMS") arrive pour le numéro EXTEN -> on le transmet à ce compte.
exten => _X.,1,NoOp(SMS de ${MESSAGE(from)} vers ${EXTEN} : ${MESSAGE(body)})
 same => n,MessageSend(pjsip:${EXTEN},${MESSAGE(from)})
 same => n,NoOp(Statut d'envoi : ${MESSAGE_SEND_STATUS})
 same => n,Hangup()
