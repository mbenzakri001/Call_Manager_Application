[general]
rtpstart=10000
rtpend=10100
; ICE est requis par WebRTC (app Flutter / compte 1003)
icesupport=yes

; Dans Docker, Asterisk ne connaît que son IP interne (172.30.0.10, fixée
; dans docker-compose.yml). On annonce à la place l'IP Wi-Fi du PC, seule
; joignable depuis le téléphone. A mettre à jour si l'IP du PC change
; (comme external_media_address dans pjsip.conf).
[ice_host_candidates]
172.30.0.10 => 192.168.55.12
