[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
external_media_address=192.168.55.12
external_signaling_address=192.168.55.12
local_net=127.0.0.1/32

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060
external_media_address=192.168.55.12
external_signaling_address=192.168.55.12
local_net=127.0.0.1/32

; SIP sur WebSocket (app Flutter / sip_ua). Le port est ignoré :
; c'est le serveur HTTP (http.conf, port 8088) qui écoute sur /ws.
[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0

[endpoint-base](!)
type=endpoint
context=interne
message_context=messages
disallow=all
allow=ulaw,alaw
direct_media=yes
; IP annoncée dans le SDP pour la voix quand elle passe par Asterisk
; (sinon il annonce son IP Docker 172.30.0.10, injoignable)
media_address=192.168.55.12
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[auth-base](!)
type=auth
auth_type=userpass

[aor-base](!)
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=25

[1001](endpoint-base)
auth=1001
aors=1001
callerid="Client A" <1001>

[1001](auth-base)
username=1001
password=Labo1001

[1001](aor-base)

[1002](endpoint-base)
auth=1002
aors=1002
callerid="Client B" <1002>

[1002](auth-base)
username=1002
password=Labo1002

[1002](aor-base)

; Compte de l'app Flutter (sip_ua, via WebSocket + WebRTC)
[1003](endpoint-base)
auth=1003
aors=1003
callerid="Call Manager" <1003>
; webrtc=yes active ICE, AVPF, rtcp_mux et le chiffrement DTLS-SRTP
webrtc=yes
dtls_auto_generate_cert=yes
; Linphone envoie du RTP en clair, l'app du SRTP chiffré :
; Asterisk doit rester au milieu pour traduire.
direct_media=no
; Opus (natif WebRTC) en plus de ulaw/alaw hérités du modèle
allow=opus

[1003](auth-base)
username=1003
password=Labo1003

[1003](aor-base)
