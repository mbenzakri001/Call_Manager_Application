[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
external_media_address=192.168.60.139
external_signaling_address=192.168.60.139
local_net=127.0.0.1/32

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060
external_media_address=192.168.60.139
external_signaling_address=192.168.60.139
local_net=127.0.0.1/32

[endpoint-base](!)
type=endpoint
context=interne
disallow=all
allow=ulaw,alaw
direct_media=yes
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[auth-base](!)
type=auth
auth_type=userpass

[aor-base](!)
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=25

[1001](endpoint-base)
auth=1001
aors=1001
callerid="Client A" <1001>

[1001](auth-base)
username=1001
password=Labo1001

[1001](aor-base)

